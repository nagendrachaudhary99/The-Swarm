name: swarm
description: The Swarm — an anonymous campus sonar that only wakes a few nights a year.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Bundled, not fetched. Three variable families, 1.3 MB, no network on boot.
  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
